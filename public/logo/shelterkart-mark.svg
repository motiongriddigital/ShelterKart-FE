  <rect x="91" y="70" width="18" height="90" fill="#A6812E"/>
  <rect x="117" y="115" width="18" height="45" fill="#0E2A4D"/>
  <path d="M55 145L80 172L150 95" fill="none" stroke="#A6192E" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
